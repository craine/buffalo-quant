name: Cards refresh
# After the daily NHL ingest publishes new data, rebuild the league player cards and the site, validate them, and commit to main.
# Only the league card files and the built site change. Files behind published stories (skaters.json, goalies.json, reports/*.md)
# are pinned to their own AS_OF dates; the run fails if any of them would change.
on:
  workflow_run:
    workflows: ["NHL ingest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned to the versions the xG model and ratings were validated with; the xG model is refit each run.
      - run: pip install pandas==3.0.5 numpy==2.5.3 pyarrow==26.0.1 scikit-learn==1.9.1 matplotlib==3.11.2 pytest pyyaml markdown
      - name: Rebuild NHL tables and cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          python -m src.ingest.nhl
          python -m src.clean.nhl
          python -m src.metrics.nhl_xg
          python -m src.reports.skater_cards --league --latest
          python -m src.reports.goalie_cards --league --latest
      - name: Validate before publishing
        run: |
          PYTHONPATH=. python scripts/validate_cards.py
          python -m pytest -q tests/test_nhl.py
          git diff --exit-code -- reports/cards/skaters.json reports/cards/goalies.json reports/*.md
      - name: Build site
        run: python -m src.site.build
      - name: Commit if anything changed
        run: |
          git config user.name "buffalo-quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cards/skaters_league.json reports/cards/goalies_league.json site
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          d=$(python -c "import json;print(json.load(open('reports/cards/skaters_league.json'))['meta']['as_of'])")
          git commit -m "Cards refresh: games through $d"
          git pull --rebase origin main
          git push origin HEAD:main
