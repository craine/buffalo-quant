name: Cards refresh
# After the daily NHL ingest publishes new data, rebuild the league player cards, validate them (building the site locally to test the
# pages), and commit the two card data files to main. Cloudflare Pages builds the site itself on every deploy. Files behind published stories (skaters.json, goalies.json, reports/*.md)
# are pinned to their own AS_OF dates; the run fails if any of them would change.
on:
  workflow_run:
    workflows: ["NHL ingest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned to the versions the xG model and ratings were validated with. The xG model trains only on completed seasons, so each
      # run reproduces it exactly; validate_cards.py checks that against config/xg_fingerprint.json.
      - run: pip install pandas==3.0.5 numpy==2.5.3 pyarrow==26.0.1 scikit-learn==1.9.1 matplotlib==3.11.2 pytest pyyaml markdown
      - name: Rebuild NHL tables and cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          python -m src.ingest.nhl
          python -m src.clean.nhl
          python -m src.metrics.nhl_xg
          python -m src.reports.skater_cards --league --latest
          python -m src.reports.goalie_cards --league --latest
      - name: Validate the card data
        run: PYTHONPATH=. python scripts/validate_cards.py
      - name: Build site
        run: python -m src.site.build
      - name: Test data, cards and pages; confirm pinned files untouched
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_nhl.py tests/test_cards.py tests/test_review_gate.py | tee /tmp/pytest.txt
          if grep -qi "skipped" /tmp/pytest.txt; then echo "Tests were skipped; refusing to publish"; exit 1; fi
          git diff --exit-code -- reports/cards/skaters.json reports/cards/goalies.json reports/*.md ledger/
      - name: Commit if anything changed
        run: |
          git config user.name "buffalo-quant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/cards/skaters_league.json reports/cards/goalies_league.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          d=$(python -c "import json;print(json.load(open('reports/cards/skaters_league.json'))['meta']['as_of'])")
          git commit -m "Cards refresh: games through $d"
          git pull --rebase origin main
          git push origin HEAD:main
